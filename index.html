<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAPCHAT</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial;background:#0f0a1a;color:#fff}
.topbar{background:#1a1030;padding:14px;text-align:center;font-size:22px;font-weight:900;letter-spacing:2px;color:#c084fc;position:sticky;top:0;z-index:10}
.topbar span{color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px;background:#160b2a;position:sticky;top:52px;z-index:10}
.tabs button{white-space:nowrap;border:0;padding:8px 14px;border-radius:20px;background:#2a1a4a;color:#ccc;cursor:pointer}
.tabs button.active{background:#a855f7;color:#fff;font-weight:700}
.panel{background:#1c1233;border:1px solid #3a2360;border-radius:14px;padding:14px;margin:12px}
input,textarea,select{width:100%;padding:11px;border-radius:10px;border:1px solid #3a2360;background:#140b28;color:#fff;margin:6px 0;outline:none}
.btn{background:#a855f7;color:#fff;border:0;padding:11px;border-radius:10px;width:100%;font-weight:700;cursor:pointer;margin:6px 0}
.btn2{background:#2a1a4a;color:#fff;border:1px solid #4a2d7a;padding:9px 12px;border-radius:10px;cursor:pointer}
.full{width:100%} .hidden{display:none!important} .small{font-size:12px;color:#aaa}
.userRow{display:flex;justify-content:space-between;align-items:center;background:#241640;padding:10px;border-radius:10px;margin:8px 0}
.post{background:#1c1233;border:1px solid #3a2360;border-radius:14px;padding:14px;margin:12px}
.post img,.post video{width:100%;border-radius:10px;margin-top:10px}
.msg{max-width:80%;padding:9px 12px;border-radius:14px;margin:6px 0;word-break:break-word}
.msg.me{background:#a855f7;margin-left:auto} .msg.other{background:#2a1a4a}
#coverImg{width:100%;height:140px;object-fit:cover;border-radius:12px}
</style>
</head>
<body>
<div class="topbar">WAP<span>CHAT</span></div>

<div class="tabs" id="mainTabs">
<button data-tab="feed" class="active">Home</button>
<button data-tab="create">Create Post</button>
<button data-tab="notes">Notes</button>
<button data-tab="profile">My Profile</button>
<button data-tab="chat">Chats</button>
<button data-tab="calls">Calls</button>
<button data-tab="friends">Friends</button>
</div>
<!-- AUTH -->
<div id="authBox" class="panel">
<h2>Welcome to WAPCHAT</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn" class="btn">Login</button>
<button id="signupBtn" class="btn2 full">Create Account</button>
<p id="authMessage" class="small"></p>
</div>

<div id="appBox" class="hidden">
<!-- 1. FEED -->
<section id="feedTab"><div id="feed"></div></section>

<!-- 2. CREATE POST -->
<section id="createTab" class="hidden"><div class="panel"><h2>Create Post</h2>
<textarea id="postText" placeholder="What's on your mind?"></textarea>
<label class="small">Photo / Video</label><input id="mediaFile" type="file" accept="image/*,video/*"><div id="previewBox"></div>
<label class="small">Music Audio</label><input id="musicFile" type="file" accept="audio/*">
<label class="small">Or Paste Music Link (YouTube / Spotify)</label><input id="musicLink" placeholder="https://...">
<button id="publishBtn" class="btn">PUBLISH POST</button><p id="postMessage" class="small"></p>
</div></section>
<!-- 3. NOTES -->
<section id="notesTab" class="hidden"><div class="panel"><h2>My Notes</h2>
<input id="noteTitle" placeholder="Note title"><textarea id="noteText" placeholder="Write your private note..."></textarea>
<button id="saveNoteBtn" class="btn">Save Note</button><p id="noteMessage" class="small"></p><div id="notesList"></div>
</div></section>

<!-- 4. PROFILE -->
<section id="profileTab" class="hidden"><div class="panel"><h2>My Profile</h2>
<img id="coverImg" class="hidden"><div id="coverWrap"><p class="small">No cover yet</p></div>
<input id="coverFile" type="file" accept="image/*"><button id="saveCoverBtn" class="btn2 full">Save Cover Photo</button><hr>
<input id="displayName" placeholder="Display Name"><input id="bio" placeholder="Bio">
<button id="saveProfileBtn" class="btn">SAVE PROFILE</button>
<button id="logoutBtn" class="btn2 full">Logout</button><p id="profileMessage" class="small"></p>
</div></section>
<!-- 5. CHAT - FRIENDS ONLY -->
<section id="chatTab" class="hidden">
<div class="panel"><h2>Chats</h2><p class="small">Friends mo lang ang pwede mo i-chat.</p><div id="chatUserList"></div></div>
<div class="panel"><h2 id="chatWith">Select a friend to chat</h2><div id="chatMessages" style="max-height:300px;overflow:auto"></div>
<input id="chatInput" placeholder="Type message..."><button id="sendChatBtn" class="btn">Send</button></div>
</section>
<!-- 6. CALLS -->
<section id="callsTab" class="hidden">
<div class="panel"><h2>Audio & Video Calls</h2><p class="small">Pili ka ng user para tawagan.</p><div id="callUserList"></div>
<div id="incomingCallBox" class="hidden" style="background:#2a1a3d;border:1px solid #a855f7;border-radius:12px;padding:14px;margin-top:12px">
<b id="incomingCallText">Incoming call...</b><br><br><button id="acceptCallBtn" class="btn">Accept</button><button id="declineCallBtn" class="btn2">Decline</button></div></div>
<div id="activeCallBox" class="panel hidden"><h2 id="callStatus">In Call</h2>
<video id="remoteVideo" autoplay playsinline style="width:100%;background:#000;border-radius:12px;min-height:200px"></video>
<video id="localVideo" autoplay muted playsinline style="width:120px;height:90px;object-fit:cover;border-radius:10px;margin-top:-100px;margin-left:10px;border:2px solid #a855f7;position:relative"></video>
<div style="display:flex;gap:8px;margin-top:12px"><button id="muteBtn" class="btn2 full">Mute</button><button id="cameraBtn" class="btn2 full">Camera Off</button><button id="endCallBtn" class="btn full" style="background:#fb315e">End Call</button></div><p id="callMessage" class="small"></p></div>
</section>
<!-- 7. FRIENDS -->
<section id="friendsTab" class="hidden">
<div class="panel"><h2>Friend Requests</h2><div id="friendRequests"></div></div>
<div class="panel"><h2>My Friends</h2><div id="friendsList"></div></div>
<div class="panel"><h2>Add Friends</h2><div id="addFriendList"></div></div>
</section>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, getDocs, deleteDoc, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ============ CONFIG - PALITAN MO NG SAYO ============
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAUduPg1z57zxtmg_5SX6PLIGTrAksVI78",
  authDomain: "wapchat-7740b.firebaseapp.com",
  projectId: "wapchat-7740b",
  storageBucket: "wapchat-7740b.firebasestorage.app",
  messagingSenderId: "216692723965",
  appId: "1:216692723965:web:d4c9325720781a73bfae94",
  measurementId: "G-M3XFSNF79M"
};
// ================================================

const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app);
const $=id=>document.getElementById(id); let currentUser=null, selectedFile=null, selectedMusic=null, selectedCover=null, currentChatId=null, currentChatUid=null;
let myFriends=[]; let myPendingSent=[];
const message=(id,txt,isErr=false)=>{ const el=$(id); if(el){ el.textContent=txt; el.style.color=isErr?"#ff6b6b":"#aaa"; } };
function getPrivateChatId(a,b){ return [a,b].sort().join("_"); }

// ============ AUTH ============
$("loginBtn").onclick = async (e) => {
  if(e) e.preventDefault();
  $("authMsg").textContent = "Logging in...";
  $("loginBtn").disabled = true;
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
    $("authMsg").textContent = "Login success!";
  } catch(err) {
    $("authMsg").textContent = err.message;
    $("loginBtn").disabled = false;
  }
};

 fd.append("file",file); fd.append("upload_preset",UPLOAD_PRESET); const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resource}/upload`,{method:"POST",body:fd}); const j=await r.json(); if(j.error) throw new Error(j.error.message); return j.secure_url; }
$("coverFile").onchange=e=>{ selectedCover=e.target.files[0]; if(selectedCover){ $("coverImg").src=URL.createObjectURL(selectedCover); $("coverImg").classList.remove("hidden"); } };
$("saveCoverBtn").onclick=async()=>{ if(!selectedCover) return message("profileMessage","Pili ka muna ng cover",true); try{ message("profileMessage","Uploading cover..."); const url=await uploadToCloudinary(selectedCover,"image"); await setDoc(doc(db,"users",currentUser.uid),{coverURL:url},{merge:true}); message("profileMessage","Cover saved!"); }catch(e){ message("profileMessage",e.message,true); } };
// ============ CREATE POST ============
$("mediaFile").onchange=e=>{ selectedFile=e.target.files[0]; if(!selectedFile) return; if(selectedFile.type.startsWith("video")) $("previewBox").innerHTML=`<video src="${URL.createObjectURL(selectedFile)}" controls style="width:100%;border-radius:12px"></video>`; else $("previewBox").innerHTML=`<img src="${URL.createObjectURL(selectedFile)}" style="width:100%;border-radius:12px">`; };
$("musicFile").onchange=e=>selectedMusic=e.target.files[0];
$("publishBtn").onclick=async()=>{ const text=$("postText").value.trim(); if(!text && !selectedFile) return message("postMessage","Lagyan mo ng text o media",true); try{ message("postMessage","Publishing..."); let mediaURL="",mediaType=""; if(selectedFile){ mediaURL=await uploadToCloudinary(selectedFile); mediaType=selectedFile.type.startsWith("video")?"video":"image"; } let musicURL=""; if(selectedMusic) musicURL=await uploadToCloudinary(selectedMusic,"video"); await addDoc(collection(db,"posts"),{text,mediaURL,mediaType,musicURL,musicLink:$("musicLink").value.trim(),uid:currentUser.uid,author:($("displayName").value||currentUser.email),createdAt:serverTimestamp()}); $("postText").value=""; $("musicLink").value=""; $("previewBox").innerHTML=""; selectedFile=null; selectedMusic=null; message("postMessage","Posted!"); document.querySelector('[data-tab="feed"]').click(); }catch(e){ message("postMessage",e.message,true); } };
// ============ FEED ============
function renderPost(id,d){ const div=document.createElement("div"); div.className="panel"; div.innerHTML=`<div class="flex"><b>${d.author||"User"}</b><span class="small">${d.createdAt?.toDate().toLocaleString()||""}</span></div><p>${d.text||""}</p>${d.mediaType==="video"?`<video src="${d.mediaURL}" controls style="width:100%;border-radius:12px"></video>`:d.mediaURL?`<img src="${d.mediaURL}" style="width:100%;border-radius:12px">`:""}${d.musicURL?`<audio controls src="${d.musicURL}" style="width:100%"></audio>`:""}${d.musicLink?`<a class="small" href="${d.musicLink}" target="_blank">🎵 Listen to attached music</a><br>`:""}<div class="flex"><button class="btn2" data-like="${id}">❤️ Like</button><span class="small" id="likeCount-${id}"></span></div><div id="comments-${id}"></div><div class="flex"><input id="commentInput-${id}" placeholder="Write a comment..."><button class="btn2" data-comment="${id}">Send</button></div>`; div.querySelector("[data-like]").onclick=()=>toggleLike(id); div.querySelector("[data-comment]").onclick=()=>addComment(id); listenComments(id); listenLikes(id); return div; }
function loadFeed(){ onSnapshot(query(collection(db,"posts"),orderBy("createdAt","desc")),(snap)=>{ const f=$("feed"); f.innerHTML=""; snap.forEach(d=>f.appendChild(renderPost(d.id,d.data()))); if(!snap.size) f.innerHTML="<p class='small'>No posts yet. Be the first!</p>"; }); }
async function toggleLike(postId){ const ref=doc(db,"posts",postId,"likes",currentUser.uid); const s=await getDoc(ref); if(s.exists()) await deleteDoc(ref); else await setDoc(ref,{uid:currentUser.uid,createdAt:serverTimestamp()}); }
function listenLikes(postId){ onSnapshot(collection(db,"posts",postId,"likes"),(s)=>{ const el=$(`likeCount-${postId}`); if(el) el.textContent=s.size+" likes"; }); }
// ============ COMMENTS ============
async function addComment(postId){ const inp=$(`commentInput-${postId}`); const text=inp.value.trim(); if(!text) return; await addDoc(collection(db,"posts",postId,"comments"),{text,uid:currentUser.uid,author:($("displayName").value||currentUser.email),createdAt:serverTimestamp()}); inp.value=""; }
function listenComments(postId){ onSnapshot(query(collection(db,"posts",postId,"comments"),orderBy("createdAt","asc")),(snap)=>{ const box=$(`comments-${postId}`); if(!box) return; box.innerHTML=""; snap.forEach(c=>{ const d=c.data(); const p=document.createElement("p"); p.className="small"; p.innerHTML=`<b>${d.author}:</b> ${d.text}`; box.appendChild(p); }); }); }

// ============ NOTES (PRIVATE) ============
$("saveNoteBtn").onclick=async()=>{ const title=$("noteTitle").value.trim(); const text=$("noteText").value.trim(); if(!text) return message("noteMessage","Walang laman yung note",true); await addDoc(collection(db,"users",currentUser.uid,"notes"),{title,text,createdAt:serverTimestamp()}); $("noteTitle").value=""; $("noteText").value=""; message("noteMessage","Note saved!"); };
function loadNotes(){ onSnapshot(query(collection(db,"users",currentUser.uid,"notes"),orderBy("createdAt","desc")),(snap)=>{ const l=$("notesList"); l.innerHTML=""; snap.forEach(d=>{ const n=d.data(); const div=document.createElement("div"); div.className="panel"; div.innerHTML=`<b>${n.title||"Untitled"}</b><p>${n.text}</p><button class="btn2" data-del="${d.id}">Delete</button>`; div.querySelector("[data-del]").onclick=async()=>{ if(confirm("Delete this note?")) await deleteDoc(doc(db,"users",currentUser.uid,"notes",d.id)); }; l.appendChild(div); }); }); }
// ============ FRIENDS ============
async function loadFriends(){ onSnapshot(collection(db,"users",currentUser.uid,"friends"),(snap)=>{ myFriends=[]; const list=$("friendsList"); list.innerHTML=""; snap.forEach(d=>{ myFriends.push(d.id); const div=document.createElement("div"); div.className="flex"; div.innerHTML=`<b>${d.data().displayName||d.id}</b><button class="btn2" data-chat="${d.id}">Chat</button><button class="btn2" data-call="${d.id}">Call</button>`; div.querySelector("[data-chat]").onclick=()=>openChat(d.id,d.data().displayName); div.querySelector("[data-call]").onclick=()=>startCall(d.id,d.data().displayName); list.appendChild(div); }); loadChatUserList(); loadCallUserList(); }); }
async function loadFriendRequests(){ onSnapshot(query(collection(db,"friendRequests"),where("toUid","==",currentUser.uid),where("status","==","pending")),(snap)=>{ const box=$("friendRequests"); box.innerHTML=""; snap.forEach(d=>{ const r=d.data(); const div=document.createElement("div"); div.className="flex"; div.innerHTML=`<b>${r.fromName}</b> wants to be your friend <button class="btn" data-accept="${d.id}">Accept</button><button class="btn2" data-decline="${d.id}">Decline</button>`; div.querySelector("[data-accept]").onclick=()=>respondRequest(d.id,r,"accepted"); div.querySelector("[data-decline]").onclick=()=>respondRequest(d.id,r,"declined"); box.appendChild(div); }); if(!snap.size) box.innerHTML="<p class='small'>No pending requests.</p>"; }); }
async function respondRequest(reqId,r,status){ await setDoc(doc(db,"friendRequests",reqId),{status},{merge:true}); if(status==="accepted"){ await setDoc(doc(db,"users",currentUser.uid,"friends",r.fromUid),{displayName:r.fromName}); await setDoc(doc(db,"users",r.fromUid,"friends",currentUser.uid),{displayName:($("displayName").value||currentUser.email)}); } }
async function loadAddFriends(){ onSnapshot(collection(db,"users"),(snap)=>{ const list=$("addFriendList"); list.innerHTML=""; snap.forEach(d=>{ if(d.id===currentUser.uid||myFriends.includes(d.id)) return; const div=document.createElement("div"); div.className="flex"; div.innerHTML=`<b>${d.data().displayName||d.data().email}</b><button class="btn2" data-add="${d.id}">+ Add Friend</button>`; div.querySelector("[data-add]").onclick=()=>sendFriendRequest(d.id,d.data().displayName||d.data().email); list.appendChild(div); }); }); }
async function sendFriendRequest(toUid,toName){ await addDoc(collection(db,"friendRequests"),{fromUid:currentUser.uid,fromName:($("displayName").value||currentUser.email),toUid,toName,status:"pending",createdAt:serverTimestamp()}); alert("Friend request sent to "+toName); }

// ============ CHAT LIST ============
function loadChatUserList(){ const box=$("chatUserList"); box.innerHTML=""; myFriends.forEach(fid=>{ const btn=document.createElement("button"); btn.className="btn2"; btn.style.display="block"; btn.style.marginBottom="6px"; btn.textContent="Chat • "+fid.slice(0,8); btn.onclick=()=>openChat(fid,fid); box.appendChild(btn); }); if(!myFriends.length) box.innerHTML="<p class='small'>Add friends first to chat.</p>"; }
// ============ CHAT MESSAGES ============
function openChat(uid,name){ currentChatUid=uid; currentChatId=getPrivateChatId(currentUser.uid,uid); $("chatWith").textContent="Chatting with "+name; $("chatMessages").innerHTML=""; onSnapshot(query(collection(db,"chats",currentChatId,"messages"),orderBy("createdAt","asc")),(snap)=>{ const box=$("chatMessages"); box.innerHTML=""; snap.forEach(d=>{ const m=d.data(); const p=document.createElement("p"); p.className="small"; p.innerHTML=`<b>${m.senderName}:</b> ${m.text}`; box.appendChild(p); }); box.scrollTop=box.scrollHeight; }); }
$("sendChatBtn").onclick=async()=>{ if(!currentChatId) return alert("Pili ka muna ng ka-chat"); const text=$("chatInput").value.trim(); if(!text) return; await addDoc(collection(db,"chats",currentChatId,"messages"),{text,senderUid:currentUser.uid,senderName:($("displayName").value||currentUser.email),createdAt:serverTimestamp()}); $("chatInput").value=""; };
// ============ CALLS ============
let localStream=null, peerConn=null, callDocRef=null;
function loadCallUserList(){ const box=$("callUserList"); box.innerHTML=""; myFriends.forEach(fid=>{ const btn=document.createElement("button"); btn.className="btn2"; btn.style.display="block"; btn.style.marginBottom="6px"; btn.textContent="Call • "+fid.slice(0,8); btn.onclick=()=>startCall(fid,fid); box.appendChild(btn); }); if(!myFriends.length) box.innerHTML="<p class='small'>Add friends first to call.</p>"; }
async function startCall(friendUid,friendName){ currentChatUid=friendUid; $("callStatus").textContent="Calling "+friendName+"..."; $("callControls").classList.remove("hidden"); localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:true}); $("localVideo").srcObject=localStream; peerConn=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]}); localStream.getTracks().forEach(t=>peerConn.addTrack(t,localStream)); peerConn.ontrack=e=>{ $("remoteVideo").srcObject=e.streams[0]; }; callDocRef=doc(collection(db,"calls")); peerConn.onicecandidate=e=>{ if(e.candidate) addDoc(collection(callDocRef,"callerCandidates"),e.candidate.toJSON()); }; const offer=await peerConn.createOffer(); await peerConn.setLocalDescription(offer); await setDoc(callDocRef,{offer:{type:offer.type,sdp:offer.sdp},callerUid:currentUser.uid,calleeUid:friendUid,createdAt:serverTimestamp()}); onSnapshot(callDocRef,(s)=>{ const d=s.data(); if(d?.answer && !peerConn.currentRemoteDescription) peerConn.setRemoteDescription(new RTCSessionDescription(d.answer)); }); onSnapshot(collection(callDocRef,"calleeCandidates"),(snap)=>{ snap.docChanges().forEach(c=>{ if(c.type==="added") peerConn.addIceCandidate(new RTCIceCandidate(c.doc.data())); }); }); }
$("endCallBtn").onclick=async()=>{ try{ peerConn?.close(); localStream?.getTracks().forEach(t=>t.stop()); if(callDocRef) await deleteDoc(callDocRef); }catch(e){} $("callControls").classList.add("hidden"); $("callStatus").textContent="Call ended"; };
// ============ AUTH STATE + INIT ============
onAuthStateChanged(auth,async(user)=>{ currentUser=user; if(user){ $("authSection").classList.add("hidden"); $("appSection").classList.remove("hidden"); $("userEmail").textContent=user.email; await loadMyProfile(); loadFeed(); loadNotes(); loadFriends(); loadFriendRequests(); loadAddFriends(); listenIncomingCalls(); }else{ $("authSection").classList.remove("hidden"); $("appSection").classList.add("hidden"); } });
function listenIncomingCalls(){ onSnapshot(query(collection(db,"calls"),where("calleeUid","==",currentUser.uid)),(snap)=>{ snap.forEach(async(d)=>{ const call=d.data(); if(call.answer) return; if(confirm("Incoming call from "+call.callerUid.slice(0,8)+". Accept?")){ callDocRef=d.ref; $("callStatus").textContent="In call..."; $("callControls").classList.remove("hidden"); document.querySelector('[data-tab="calls"]').click(); localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:true}); $("localVideo").srcObject=localStream; peerConn=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]}); localStream.getTracks().forEach(t=>peerConn.addTrack(t,localStream)); peerConn.ontrack=e=>{ $("remoteVideo").srcObject=e.streams[0]; }; peerConn.onicecandidate=e=>{ if(e.candidate) addDoc(collection(callDocRef,"calleeCandidates"),e.candidate.toJSON()); }; await peerConn.setRemoteDescription(new RTCSessionDescription(call.offer)); const answer=await peerConn.createAnswer(); await peerConn.setLocalDescription(answer); await setDoc(callDocRef,{answer:{type:answer.type,sdp:answer.sdp}},{merge:true}); onSnapshot(collection(callDocRef,"callerCandidates"),(s)=>{ s.docChanges().forEach(c=>{ if(c.type==="added") peerConn.addIceCandidate(new RTCIceCandidate(c.doc.data())); }); }); } }); }); }
// ... yung listenIncomingCalls code ...

</script>
</body>
</html>
