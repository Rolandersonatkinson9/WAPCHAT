<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAPCHAT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0b1220;color:white;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
.card{background:#111c33;width:100%;max-width:420px;border-radius:20px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
h1{text-align:center;color:#4da3ff;font-size:32px;letter-spacing:2px}
p.sub{text-align:center;color:#9fb3d1;margin:6px 0 20px;font-size:13px}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #2a3a5a;background:#0b1220;color:white;margin-bottom:10px;outline:none}
input:focus{border-color:#4da3ff}
button{width:100%;padding:13px;border:none;border-radius:10px;background:#2f7bff;color:white;font-weight:bold;font-size:15px;cursor:pointer;margin-bottom:8px}
button.secondary{background:#1e2e4d}
button:active{opacity:.8}
#msg{text-align:center;font-size:13px;min-height:18px;margin-top:8px;color:#ff8a8a}
#chatBox{display:none}
#messages{height:320px;overflow-y:auto;background:#0b1220;border-radius:12px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.bubble{background:#1e2e4d;padding:9px 12px;border-radius:12px;max-width:85%;font-size:14px}
.bubble.me{background:#2f7bff;align-self:flex-end}
.bubble small{display:block;color:#cbd5e1;font-size:11px;margin-bottom:2px}
.row{display:flex;gap:8px}
.row input{margin:0}
.row button{width:90px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top b{font-size:14px;color:#9fb3d1}
.top button{width:auto;padding:8px 12px;font-size:12px;background:#ff4444;margin:0}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="card">
  <div id="authBox">
    <h1>WAPCHAT</h1>
    <p class="sub">Fast • Secure • Free Chat</p>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password (at least 6 characters)">
    <button id="loginBtn">Login</button>
    <button id="signupBtn" class="secondary">Create Account</button>
    <div id="msg"></div>
  </div>

  <div id="chatBox">
    <div class="top"><b id="userEmail"></b><button id="logoutBtn">Logout</button></div>
    <div id="messages"></div>
    <div class="row">
      <input id="chatInput" placeholder="Type a message...">
      <button id="sendBtn">Send</button>
    </div>
    <div id="msg2"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDc2Yx3c3MtujTck2_lHHUqV0vrbgu6sZY",
  authDomain: "wapchat-f6126.firebaseapp.com",
  projectId: "wapchat-f6126",
  storageBucket: "wapchat-f6126.firebasestorage.app",
  messagingSenderId: "257085623528",
  appId: "1:257085623528:web:8f7c3e27eaabeec19bcd5d",
  measurementId: "G-EXD1XBTTVH"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const emailEl = document.getElementById('email');
const passEl = document.getElementById('password');
const msgEl = document.getElementById('msg');
const msg2El = document.getElementById('msg2');

function showMsg(t){ msgEl.textContent = t; }
function showMsg2(t){ msg2El.textContent = t; }

document.getElementById('loginBtn').onclick = async () => {
  showMsg('Logging in...');
  try{
    await signInWithEmailAndPassword(auth, emailEl.value.trim(), passEl.value);
    showMsg('Login success!');
  }catch(e){ showMsg(e.message); }
};
document.getElementById('signupBtn').onclick = async () => {
  showMsg('Creating account...');
  try{
    await createUserWithEmailAndPassword(auth, emailEl.value.trim(), passEl.value);
    showMsg('Account created! You are now logged in.');
  }catch(e){ showMsg(e.message); }
};
document.getElementById('logoutBtn').onclick = () => signOut(auth);

document.getElementById('sendBtn').onclick = async () => {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  try{
    await addDoc(collection(db, "messages"), {
      text: text,
      email: auth.currentUser.email,
      createdAt: serverTimestamp()
    });
    input.value = "";
  }catch(e){ showMsg2(e.message); }
};

onAuthStateChanged(auth, (user) => {
  if(user){
    document.getElementById('authBox').classList.add('hidden');
    document.getElementById('chatBox').style.display = 'block';
    document.getElementById('userEmail').textContent = user.email;
    loadMessages();
  } else {
    document.getElementById('authBox').classList.remove('hidden');
    document.getElementById('chatBox').style.display = 'none';
  }
});

let unsub = null;
function loadMessages(){
  if(unsub) return;
  const q = query(collection(db, "messages"), orderBy("createdAt"));
  unsub = onSnapshot(q, (snap) => {
    const box = document.getElementById('messages');
    box.innerHTML = "";
    snap.forEach(doc => {
      const d = doc.data();
      const div = document.createElement('div');
      const isMe = d.email === auth.currentUser.email;
      div.className = 'bubble' + (isMe ? ' me' : '');
      div.innerHTML = `<small>${d.email || 'User'}</small>${d.text || ''}`;
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  }, (err) => { showMsg2("Chat error: " + err.message + " - Check Firestore Rules"); });
}
</script>
</body>
</html>
