name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install and Build
        run: |
          npm install
          npm run build || npx vite build || echo "no build"
          npx cap sync android
      - name: Add Notification Permission
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $FILE || sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application|' $FILE
          cat $FILE
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WAPCHAT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk