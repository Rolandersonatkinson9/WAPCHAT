name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Sync
        run: |
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/push-notifications @capacitor/local-notifications @capacitor/assets
          mkdir -p www
          cp *.html *.css *.js *.json *.png www/ 2>/dev/null || true
          mkdir -p assets
          cp wapchat_icon.png assets/icon.png
          cp wapchat_icon.png assets/splash.png
          npx cap init WAPCHAT com.wapchat.app --web-dir=www
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android
      - name: Add Permissions
        run: |
          python3 -c "
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          t = p.read_text()
          perms = ['INTERNET','ACCESS_NETWORK_STATE','POST_NOTIFICATIONS','RECORD_AUDIO','CAMERA','MODIFY_AUDIO_SETTINGS','READ_MEDIA_IMAGES']
          for perm in perms:
              tag = f'<uses-permission android:name=\"android.permission.{perm}\" />'
              if perm not in t:
                  t = t.replace('<application', tag + '\n  <application', 1)
          p.write_text(t)
          "
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
