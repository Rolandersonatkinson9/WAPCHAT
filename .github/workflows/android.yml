name: Build WAPCHAT APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Capacitor - PINNED STABLE
        run: npm install @capacitor/core@6.2.2 @capacitor/cli@6.2.2 @capacitor/android@6.2.2
      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json www/manifest.json || true
      - name: Init Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android
      - name: Add Camera and Mic Permission
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
             - name: Add Camera and Mic Permission
        run: |
          python3 << 'PYEOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          t = open(p).read()
          for perm in ['CAMERA','RECORD_AUDIO','MODIFY_AUDIO_SETTINGS','POST_NOTIFICATIONS','VIBRATE','FOREGROUND_SERVICE']:
              tag = f'<uses-permission android:name="android.permission.{perm}" />'
              if perm not in t:
                  t = t.replace('<application', tag + '\n    <application', 1)
          open(p,'w').write(t)
          print("OK - Permissions Added")
          PYEOF             
          cat $FILE
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WAPCHAT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk  