
name: Build WAPCHAT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get WAPCHAT source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
        

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare WAPCHAT web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          node -e "const fs=require('fs'); const p=require('./capacitor.config.json'); p.webDir='www'; fs.writeFileSync('capacitor.config.json', JSON.stringify(p,null,2));"

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/android@^7.4.3

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload WAPCHAT APK
        uses: actions/upload-artifact@v4
        with:
          name: WAPCHAT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
